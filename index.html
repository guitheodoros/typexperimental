<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Type FX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e8e3d8;
    --panel:#f5f2ea;
    --ink:#111;
    --border:#111;
    --muted:#6b6558;
    --accent:#b3281c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Geist", sans-serif;
    font-optical-sizing:auto;
    font-weight:300;
    font-style:normal;
    background:var(--bg);
    color:var(--ink);
    padding:16px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:12px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
  }
  header h1{ font-size:18px; font-weight:600; margin:0; letter-spacing:1px; }
  header p{ margin:2px 0 0; font-size:11px; color:var(--muted); }
  header a{ font-size:11px; color:var(--muted); text-decoration:none; white-space:nowrap; }
  header a:hover{ color:var(--ink); text-decoration:underline; }
  .layout{ display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start; }
  .canvas-wrap{
    background:var(--panel);
    border:2px solid var(--ink);
    padding:10px;
    position:sticky;
    top:16px;
    width:fit-content;
    max-width:100%;
    justify-self:start;
  }
  .canvas-wrap .titlebar{
    display:flex; justify-content:space-between; font-size:11px;
    margin-bottom:8px; text-transform:uppercase; letter-spacing:.5px;
  }
  #canvasHost{
    position:relative; width:fit-content; max-width:100%; min-height:300px;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
  }
  #glcanvas{ max-width:100%; max-height:calc(100vh - 90px); display:block; }
  .panel{ background:var(--panel); border:2px solid var(--ink); padding:12px; margin-bottom:12px; }
  .panel h2{
    font-size:11px; font-weight:600; margin:0 0 10px; text-transform:uppercase;
    letter-spacing:1px; border-bottom:1px solid var(--ink); padding-bottom:6px;
  }
  .row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
  .row label{ font-size:11px; color:var(--muted); flex:1; }
  .row .val{ font-size:11px; min-width:34px; text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range]{ flex:2; accent-color:var(--ink); }
  select, input[type=color]{ font-family:inherit; font-size:11px; border:1px solid var(--ink); background:#fff; padding:4px 6px; flex:2; }
  textarea{
    width:100%; font-family:inherit; font-size:12px; border:1px solid var(--ink);
    background:#fff; padding:6px; resize:vertical; min-height:70px;
  }
  .check{ display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .check label{ font-size:11px; color:var(--muted); }
  button{
    font-family:inherit; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    background:var(--ink); color:#fff; border:1px solid var(--ink); padding:7px 10px; cursor:pointer;
  }
  button:hover{ background:#333; }
  button.ghost{ background:transparent; color:var(--ink); }
  button.ghost:hover{ background:var(--ink); color:#fff; }
  .btnrow{ display:flex; gap:6px; margin-top:8px; }
  .filebtn{ display:block; cursor:pointer; }
  .filebtn .fakebtn{
    display:block; text-align:center; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    background:transparent; color:var(--ink); border:1px solid var(--ink); padding:7px 10px;
  }
  .filebtn:hover .fakebtn{ background:var(--ink); color:#fff; }
  .fontname{ font-size:10px; color:var(--muted); margin:-4px 0 8px; }
  .modebtns{ display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .modebtns button{ padding:9px 6px; font-size:10px; }
  .modebtns button.active{ background:var(--accent); border-color:var(--accent); }
  footer{ margin-top:20px; font-size:10px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<header>
  <div>
    <h1>TYPE FX</h1>
    <p>tipografia experimental — distorção, degradação e colapso do texto via WebGL</p>
  </div>
  <a href="https://theodoros.cc" target="_blank" rel="noopener">theodoros.cc</a>
</header>

<div class="layout">
  <div class="sidebar">

    <div class="panel">
      <h2>Modo</h2>
      <div class="modebtns">
        <button data-mode="blur" class="active">Blur / Grão</button>
        <button data-mode="melt">Derreter</button>
        <button data-mode="degrade">Degradação</button>
        <button data-mode="block">Bloco denso</button>
        <button data-mode="halftone">Halftone</button>
        <button data-mode="pixelsort">Pixel Sort</button>
        <button data-mode="crosshatch">Crosshatch</button>
      </div>
    </div>

    <div class="panel">
      <h2>Texto</h2>
      <textarea id="textInput">MOVING\nIN</textarea>
    </div>

    <div class="panel">
      <h2>Fonte</h2>
      <div class="row">
        <label for="fontFamily">Família</label>
        <select id="fontFamily"></select>
      </div>
      <div class="btnrow">
        <label class="filebtn" style="flex:1">
          <input type="file" id="fontUpload" accept=".ttf,.otf,.woff,.woff2" style="display:none">
          <span class="fakebtn">Carregar fonte (TTF/OTF/WOFF)</span>
        </label>
      </div>
      <div class="row">
        <label for="fontSize">Tamanho</label>
        <input type="range" id="fontSize" autocomplete="off" min="30" max="150" value="100">
        <span class="val" id="fontSizeVal">100%</span>
      </div>
      <div class="row">
        <label for="fontLeading">Entrelinha</label>
        <input type="range" id="fontLeading" autocomplete="off" min="50" max="200" value="100">
        <span class="val" id="fontLeadingVal">100%</span>
      </div>
      <div class="row">
        <label for="fontWidth">Largura do texto</label>
        <input type="range" id="fontWidth" autocomplete="off" min="30" max="200" value="100">
        <span class="val" id="fontWidthVal">100%</span>
      </div>
      <div class="row">
        <label for="fontHeight">Altura do texto</label>
        <input type="range" id="fontHeight" autocomplete="off" min="30" max="200" value="100">
        <span class="val" id="fontHeightVal">100%</span>
      </div>
      <div class="row">
        <label for="fontKerning">Kerning</label>
        <input type="range" id="fontKerning" autocomplete="off" min="-20" max="100" value="0">
        <span class="val" id="fontKerningVal">0%</span>
      </div>
      <div class="row">
        <label for="fontBlur">Blur prévio</label>
        <input type="range" id="fontBlur" autocomplete="off" min="0" max="100" value="0">
        <span class="val" id="fontBlurVal">0%</span>
      </div>
    </div>

    <div class="panel">
      <h2>Cores</h2>
      <div class="row">
        <label for="inkColor">Tinta</label>
        <input type="color" id="inkColor" value="#111111">
      </div>
      <div class="row">
        <label for="bgColor">Fundo</label>
        <input type="color" id="bgColor" value="#f2f0ea">
      </div>
    </div>

    <div class="panel">
      <h2>Ajustes</h2>
      <div class="row">
        <label for="adjBrightness">Brilho</label>
        <input type="range" id="adjBrightness" autocomplete="off" min="-50" max="50" value="0">
        <span class="val" id="adjBrightnessVal">0</span>
      </div>
      <div class="row">
        <label for="adjContrast">Contraste</label>
        <input type="range" id="adjContrast" autocomplete="off" min="-50" max="100" value="0">
        <span class="val" id="adjContrastVal">0</span>
      </div>
      <div class="row">
        <label for="adjGamma">Gama</label>
        <input type="range" id="adjGamma" autocomplete="off" min="40" max="250" value="100">
        <span class="val" id="adjGammaVal">100</span>
      </div>
    </div>

    <div class="panel">
      <h2>Formato</h2>
      <div class="row">
        <label for="formatSel">Proporção</label>
        <select id="formatSel"></select>
      </div>
      <div class="row">
        <label for="zoomSlider">Zoom</label>
        <input type="range" id="zoomSlider" autocomplete="off" min="50" max="300" value="100">
        <span class="val" id="zoomSliderVal">100%</span>
      </div>
    </div>

    <div id="modeParams"></div>

    <div class="panel">
      <h2>Exportar</h2>
      <div class="row">
        <label for="exportScale">Resolução</label>
        <select id="exportScale">
          <option value="1.5">Média (~2100px)</option>
          <option value="2" selected>Alta (~2800px)</option>
          <option value="3">Máxima (~4200px)</option>
        </select>
      </div>
      <div class="btnrow">
        <button id="exportBtn" style="flex:1">Exportar PNG</button>
      </div>
    </div>

  </div>

  <div class="canvas-wrap">
    <div class="titlebar"><span>Preview</span><span id="resLabel"></span></div>
    <div id="canvasHost"><canvas id="glcanvas"></canvas></div>
  </div>
</div>

<footer>Type FX — ferramenta local, sem servidor. Nada é enviado para fora do seu navegador.</footer>

<script>
"use strict";

const FONT_FAMILIES = [
  { value:"archivo",   label:"Archivo Black", css:'"Archivo"',                    weight:900 },
  { value:"system",    label:"Sistema",       css:"system-ui, sans-serif",        weight:900 },
  { value:"arial",     label:"Arial",         css:"Arial, sans-serif",            weight:900 },
  { value:"helvetica", label:"Helvetica",     css:"Helvetica, Arial, sans-serif", weight:900 },
  { value:"impact",    label:"Impact",        css:"Impact, sans-serif",           weight:400 },
  { value:"arialblack",label:"Arial Black",   css:'"Arial Black", sans-serif',    weight:900 },
  { value:"futura",    label:"Futura",        css:"Futura, sans-serif",           weight:700 },
  { value:"gillsans",  label:"Gill Sans",     css:'"Gill Sans", sans-serif',      weight:700 },
  { value:"trebuchet", label:"Trebuchet MS",  css:'"Trebuchet MS", sans-serif',   weight:900 },
  { value:"verdana",   label:"Verdana",       css:"Verdana, sans-serif",          weight:900 },
  { value:"georgia",   label:"Georgia",       css:"Georgia, serif",               weight:700 },
  { value:"times",     label:"Times New Roman", css:'"Times New Roman", serif',   weight:700 },
  { value:"courier",   label:"Courier New",   css:'"Courier New", monospace',     weight:700 },
  { value:"mono",      label:"Monoespaçada",  css:"monospace",                    weight:700 },
];
let customFontFamily = null; // preenchido se o usuário fizer upload de uma fonte

function fontCss(px){
  if (state.font.family === "custom" && customFontFamily){
    return `${customFontFamily.weight} ${px}px ${customFontFamily.css}`;
  }
  const f = FONT_FAMILIES.find(f=>f.value===state.font.family) || FONT_FAMILIES[0];
  return `${f.weight} ${px}px ${f.css}`;
}

const FORMATS = [
  { key:"3x4", label:"Retrato 3:4", ratio: 3/4 },
  { key:"2x3", label:"Retrato 2:3", ratio: 2/3 },
  { key:"square", label:"Quadrado", ratio: 1 },
  { key:"4x3", label:"Paisagem 4:3", ratio: 4/3 },
];

const PREVIEW_LONG_EDGE = 1400;

const state = {
  mode: "blur",
  text: "MOVING\nIN",
  ink: "#111111",
  bg: "#f2f0ea",
  format: FORMATS[0],
  zoom: 100,
  seed: 7.3,
  blur: { amount: 45, dither: 55, grain: 30 },
  melt: { amount: 45, scale: 35, drip: 55 },
  degrade: { glitch: 35, dropout: 30, contrast: 20 },
  block: { size: 60, spacing: 0, removeSpaces: true },
  halftone: {
    minDot: 5, maxDot: 55, cornerRadius: 55, spacing: 25, angle: 45,
    gridType: "regular", noise: 0, invert: false,
    mergeSize: 1, mergeThreshold: 80,
    multiTone: false, toneLevels: 4,
    toneColors: ["#f2f0ea", "#d8d8d8", "#8a8a8a", "#111111"],
    toneShapes: ["round", "cross", "ring", "round"],
  },
  pixelsort: { threshold: 50, direction: "horizontal", chance: 75, reverse: false },
  crosshatch: { scale: 45, thickness: 30, angle: 45, softness: 25 },
  adjust: { brightness: 0, contrast: 0, gamma: 100 },
  font: { family: "archivo", size: 100, leading: 100, width: 100, height: 100, kerning: 0, blur: 0 },
};

let RENDER_W = 0, RENDER_H = 0;

/* ---------------------------------------------------------------------
   WEBGL SETUP
--------------------------------------------------------------------- */

const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl2", { preserveDrawingBuffer:true, alpha:false });
if (!gl) alert("Seu navegador não suporta WebGL2, necessário para esta ferramenta.");

function compileShader(src, type){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(sh));
    throw new Error("Shader compile error: " + gl.getShaderInfoLog(sh));
  }
  return sh;
}
function linkProgram(vsSrc, fsSrc){
  const vs = compileShader(vsSrc, gl.VERTEX_SHADER);
  const fs = compileShader(fsSrc, gl.FRAGMENT_SHADER);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)){
    console.error(gl.getProgramInfoLog(p));
    throw new Error("Program link error: " + gl.getProgramInfoLog(p));
  }
  return p;
}

const VERT_QUAD = `#version 300 es
in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos*0.5+0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const NOISE_GLSL = `
float hash(vec2 p){
  return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123);
}
float noise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash(i);
  float b = hash(i+vec2(1.0,0.0));
  float c = hash(i+vec2(0.0,1.0));
  float d = hash(i+vec2(1.0,1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
}
float fbm(vec2 p){
  float sum = 0.0;
  float amp = 0.5;
  mat2 rot = mat2(0.8,0.6,-0.6,0.8);
  for (int i=0;i<4;i++){
    sum += amp*noise(p);
    p = rot*p*2.13;
    amp *= 0.53;
  }
  return sum;
}`;

const FRAG_BLUR = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec2 uDirection;
uniform float uRadius;
void main(){
  vec4 sum = vec4(0.0);
  float total = 0.0;
  const int SAMPLES = 16;
  for(int i=-SAMPLES;i<=SAMPLES;i++){
    float t = float(i)/float(SAMPLES);
    float w = exp(-t*t*2.0);
    vec2 offset = uDirection * uRadius * t;
    sum += texture(uTex, vUv+offset) * w;
    total += w;
  }
  fragColor = sum/total;
}`;

const FRAG_PASSTHROUGH = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform vec3 uInk;
uniform vec3 uBg;
void main(){
  float cov = texture(uTex, vUv).a;
  fragColor = vec4(mix(uBg, uInk, cov), 1.0);
}`;

const FRAG_BLURDITHER = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uBlurredTex;
uniform sampler2D uCrispTex;
uniform float uDitherAmount;
uniform float uDitherScale;
uniform vec3 uInk;
uniform vec3 uBg;
uniform vec2 uResolution;
${NOISE_GLSL}
void main(){
  float covBlur = texture(uBlurredTex, vUv).a;
  float covCrisp = texture(uCrispTex, vUv).a;
  float cov = max(covBlur, covCrisp*0.9);
  vec2 cell = floor(gl_FragCoord.xy/uDitherScale);
  float thresh = hash(cell) * 0.7 + hash(cell*1.7+3.1)*0.3;
  float speck = step(thresh, cov);
  float finalAlpha = mix(cov, speck, uDitherAmount);
  fragColor = vec4(mix(uBg, uInk, finalAlpha), 1.0);
}`;

const FRAG_MELT = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform sampler2D uEdgeTex;
uniform float uMeltAmount;
uniform float uMeltScale;
uniform float uDripAmount;
uniform float uSeed;
uniform vec3 uInk;
uniform vec3 uBg;
uniform vec2 uResolution;
${NOISE_GLSL}
void main(){
  vec2 uv = vUv;
  float aspect = uResolution.x/uResolution.y;
  vec2 p = vec2(uv.x*aspect, uv.y) * uMeltScale;

  // ondulação orgânica no contorno (a tinta não escorre em linha reta)
  float wx = fbm(p + uSeed) - 0.5;
  float wy = fbm(p + uSeed + vec2(9.3, 1.7)) - 0.5;
  vec2 wobbleUv = uv + vec2(wx, wy) * uMeltAmount * 0.035;
  float covCrisp = texture(uTex, wobbleUv).a;

  // fios que escorrem: cada coluna sabe onde a letra termina embaixo
  // (pré-calculado na CPU); só algumas colunas ganham um fio, que afina
  // até sumir — em vez de "ecoar" a letra inteira pra baixo.
  vec4 edgeSample = texture(uEdgeTex, vec2(uv.x, 0.5));
  float edgeV = edgeSample.r;
  float hasInk = edgeSample.a;
  float distBelow = edgeV - uv.y;

  float strandProb = fbm(vec2(uv.x*55.0, uSeed*11.0));
  float hasStrand = smoothstep(0.52, 0.7, strandProb);
  float strandLen = uDripAmount * 0.6 * (0.25 + 0.95*fbm(vec2(uv.x*7.0, uSeed*3.0)));
  float taper = 1.0 - smoothstep(strandLen*0.55, strandLen, distBelow);
  float jitter = (fbm(vec2(uv.x*22.0 + distBelow*35.0, uSeed*8.0))-0.5)*0.012;
  float strandSample = texture(uEdgeTex, vec2(uv.x+jitter, 0.5)).a;
  float strandAlpha = hasStrand * taper * hasInk * strandSample * step(0.0, distBelow) * step(distBelow, strandLen);

  float finalAlpha = clamp(max(covCrisp, strandAlpha), 0.0, 1.0);
  fragColor = vec4(mix(uBg, uInk, finalAlpha), 1.0);
}`;

const FRAG_DEGRADE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uGlitch;
uniform float uDropout;
uniform float uContrast;
uniform vec3 uInk;
uniform vec3 uBg;
uniform vec2 uResolution;
${NOISE_GLSL}
void main(){
  vec2 uv = vUv;

  float bandCount = 90.0;
  float bandId = floor(uv.y*bandCount);
  float bandRand = hash(vec2(bandId, 9.2));
  float doGlitch = step(0.82, bandRand);
  float bandShift = (hash(vec2(bandId, 3.7))-0.5) * uGlitch * 0.06 * doGlitch;
  uv.x += bandShift;

  float cov = texture(uTex, uv).a;

  float dropN = hash(floor(uv*uResolution*0.12));
  float dropout = 1.0 - uDropout*step(dropN, 0.16);

  float finalAlpha = cov * dropout;
  finalAlpha = clamp((finalAlpha-0.5)*(1.0+uContrast*2.0)+0.5, 0.0, 1.0);

  float grain = (hash(gl_FragCoord.xy*1.3)-0.5)*0.06;
  vec3 col = mix(uBg, uInk, finalAlpha) + vec3(grain);

  fragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;

const FRAG_HALFTONE = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uMinDot;
uniform float uMaxDot;
uniform float uCornerRadius;
uniform float uSpacing;
uniform float uAngleDeg;
uniform float uGridType; // 0=regular 1=benday (linhas ímpares deslocadas meia célula) 2=hex
uniform float uNoiseAmt; // jitter de posição por célula, em px
uniform float uInvert;
uniform vec3 uInk;
uniform vec3 uBg;
uniform vec2 uResolution;

// fusão de área forte: em blocos muito escuros/claros, várias células
// viram uma célula gigante só, pra não ficar um mosaico ruidoso onde já
// era pra ser um bloco sólido de tinta.
uniform float uMergeSize; // 1 = desligado, 2/3/4 = NxN células por bloco
uniform float uMergeThreshold;

// multi-tom: em vez de um único ponto escalando por tom, o tom vira uma
// de até 4 faixas discretas, cada uma com sua própria cor e forma.
uniform float uMultiTone; // 0/1
uniform int uToneLevels;
uniform vec3 uToneColor[4];
uniform float uToneShape[4]; // 0=círculo/quadrado(raio) 1=cruz 2=anel

float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453123); }

// sdf de retângulo arredondado — com r=0 é um quadrado, com r=metade do
// lado vira um círculo perfeito: um único parâmetro cobre as duas formas.
float sdRoundRect(vec2 p, vec2 b, float r){
  vec2 q = abs(p) - b + r;
  return length(max(q,0.0)) + min(max(q.x,q.y),0.0) - r;
}
float sdBox(vec2 p, vec2 b){
  vec2 d = abs(p)-b;
  return length(max(d,0.0)) + min(max(d.x,d.y),0.0);
}
float sdCross(vec2 p, float size){
  float armThick = size*0.32;
  float a = sdBox(p, vec2(size*0.5, armThick*0.5));
  float b = sdBox(p, vec2(armThick*0.5, size*0.5));
  return min(a,b);
}
float sdRing(vec2 p, float size){
  return abs(length(p) - size*0.32) - size*0.16;
}
float shapeDist(vec2 p, float size, float cornerR, float shapeType){
  if (shapeType > 1.5) return sdRing(p, size);
  if (shapeType > 0.5) return sdCross(p, size);
  return sdRoundRect(p, vec2(size*0.5), clamp(cornerR, 0.0, size*0.5));
}

void main(){
  vec2 px = vUv * uResolution;
  float ang = radians(uAngleDeg);
  mat2 rot = mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
  mat2 invRot = mat2(rot[0][0], rot[1][0], rot[0][1], rot[1][1]);
  vec2 rp = rot*px;

  // sonda grosseira no bloco NxN pra decidir se essa região funde
  float cellSize = uSpacing;
  if (uMergeSize > 1.5){
    float blockSize = uSpacing*uMergeSize;
    vec2 blockIndex = floor(rp/blockSize);
    vec2 blockCenter = (blockIndex+0.5)*blockSize;
    vec2 blockUv = clamp((invRot*blockCenter)/uResolution, 0.0, 1.0);
    float blockCov = texture(uTex, blockUv).a;
    float extreme = max(blockCov, 1.0-blockCov);
    if (extreme > uMergeThreshold) cellSize = blockSize;
  }

  // grade hex: linhas mais compactas verticalmente (empacotamento
  // hexagonal real, não só quadrados deslocados) — mesma lógica de
  // deslocar linhas ímpares que o benday usa, só com outra altura de linha.
  float rowH = (uGridType > 1.5) ? cellSize*0.866 : cellSize;
  float row = floor(rp.y/rowH);
  bool shifted = uGridType > 0.5 && mod(row, 2.0) > 0.5;
  vec2 rp2 = rp;
  if (shifted) rp2.x += cellSize*0.5;

  vec2 cellIndex = vec2(floor(rp2.x/cellSize), row);
  vec2 cellCenter = vec2((cellIndex.x+0.5)*cellSize, (row+0.5)*rowH);
  vec2 jitter = (vec2(hash(cellIndex), hash(cellIndex+vec2(9.7,3.1)))-0.5) * uNoiseAmt;
  vec2 sampleCenter = cellCenter + jitter;

  // desfaz o deslocamento benday/hex antes de amostrar a cobertura de tinta
  vec2 sampleRp = sampleCenter;
  if (shifted) sampleRp.x -= cellSize*0.5;
  vec2 sampleUv = clamp((invRot*sampleRp)/uResolution, 0.0, 1.0);

  float cov = texture(uTex, sampleUv).a;
  if (uInvert > 0.5) cov = 1.0 - cov;
  float sizeMul = cellSize/uSpacing;

  vec3 col;
  if (uMultiTone > 0.5){
    int band = int(clamp(floor(cov*float(uToneLevels)), 0.0, float(uToneLevels-1)));
    float t = float(uToneLevels)>1.0 ? float(band)/float(uToneLevels-1) : 1.0;
    float dotSize = mix(uMinDot, uMaxDot, t) * sizeMul;
    vec2 local = rp2 - sampleCenter;
    float d = shapeDist(local, dotSize, uCornerRadius, uToneShape[band]);
    float mask = 1.0 - smoothstep(-1.0, 1.0, d);
    col = mix(uBg, uToneColor[band], mask);
  } else {
    float dotSize = mix(uMinDot, uMaxDot, clamp(cov,0.0,1.0)) * sizeMul;
    float r = clamp(uCornerRadius, 0.0, dotSize*0.5);
    vec2 local = rp2 - sampleCenter;
    float d = sdRoundRect(local, vec2(dotSize*0.5), r);
    float mask = 1.0 - smoothstep(-1.0, 1.0, d);
    col = mix(uBg, uInk, mask);
  }

  fragColor = vec4(col, 1.0);
}`;

const FRAG_DIRECT = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
void main(){
  fragColor = vec4(texture(uTex, vUv).rgb, 1.0);
}`;

const FRAG_CROSSHATCH = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uScale;
uniform float uThickness;
uniform float uAngleDeg;
uniform vec3 uInk;
uniform vec3 uBg;
uniform vec2 uResolution;
void main(){
  float tone = texture(uTex, vUv).a;
  float ang = radians(uAngleDeg);
  mat2 rot = mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
  vec2 p = rot*(vUv*uResolution)/uScale;
  float lw = clamp(uThickness/100.0, 0.02, 0.9);

  float hatch = 0.0;
  if (fract(p.x+p.y) < lw) hatch = 1.0;
  if (tone > 0.22){ if (fract(p.x-p.y) < lw) hatch = 1.0; }
  if (tone > 0.48){ if (fract(p.x+p.y+0.5) < lw) hatch = 1.0; }
  if (tone > 0.74){ if (fract(p.x-p.y+0.5) < lw) hatch = 1.0; }

  float finalAlpha = hatch * step(0.05, tone);
  fragColor = vec4(mix(uBg, uInk, finalAlpha), 1.0);
}`;

const FRAG_ADJUST = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 fragColor;
uniform sampler2D uTex;
uniform float uBrightness;
uniform float uContrast;
uniform float uGamma;
uniform float uZoom;
uniform vec3 uBg;
void main(){
  vec2 zUv = (vUv-0.5)/max(uZoom,0.01) + 0.5;
  bool outside = zUv.x<0.0 || zUv.x>1.0 || zUv.y<0.0 || zUv.y>1.0;
  vec3 col = outside ? uBg : texture(uTex, clamp(zUv,0.0,1.0)).rgb;
  col = (col-0.5)*(1.0+uContrast) + 0.5 + uBrightness;
  col = clamp(col, 0.0, 1.0);
  col = pow(col, vec3(1.0/uGamma));
  fragColor = vec4(clamp(col,0.0,1.0), 1.0);
}`;

const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
function bindQuad(prog){
  const loc = gl.getAttribLocation(prog, "aPos");
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
}
function drawQuad(){ gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); }

const blurProg = linkProgram(VERT_QUAD, FRAG_BLUR);
const passProg = linkProgram(VERT_QUAD, FRAG_PASSTHROUGH);
const blurDitherProg = linkProgram(VERT_QUAD, FRAG_BLURDITHER);
const meltProg = linkProgram(VERT_QUAD, FRAG_MELT);
const degradeProg = linkProgram(VERT_QUAD, FRAG_DEGRADE);
const halftoneProg = linkProgram(VERT_QUAD, FRAG_HALFTONE);
const directProg = linkProgram(VERT_QUAD, FRAG_DIRECT);
const crosshatchProg = linkProgram(VERT_QUAD, FRAG_CROSSHATCH);
const adjustProg = linkProgram(VERT_QUAD, FRAG_ADJUST);

function createTexture(w,h){
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}
function createFBO(tex){
  const fbo = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return fbo;
}

let textTex = null;
let blurredTex = null, blurredFBO = null;
let pingTex, pingFBO, pongTex, pongFBO;
let edgeTex = null;
let effectTex = null, effectFBO = null;
let pixelSortTex = null;
let rasterCanvas = document.createElement("canvas");

function ensureTargets(w,h){
  textTex = createTexture(w,h);
  blurredTex = createTexture(w,h); blurredFBO = createFBO(blurredTex);
  pingTex = createTexture(w,h); pingFBO = createFBO(pingTex);
  pongTex = createTexture(w,h); pongFBO = createFBO(pongTex);
  edgeTex = createTexture(w,1);
  effectTex = createTexture(w,h); effectFBO = createFBO(effectTex);
  pixelSortTex = createTexture(w,h);
}

function uploadRaster(){
  gl.bindTexture(gl.TEXTURE_2D, textTex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, rasterCanvas);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

// pra cada coluna x, acha a linha mais baixa (mais próxima do fundo) que
// ainda tem tinta — usado pelo modo Derreter pra saber de onde cada "fio"
// de tinta escorrida deve partir.
function computeColumnEdges(){
  const w = RENDER_W, h = RENDER_H;
  const ctx = rasterCanvas.getContext("2d");
  const data = ctx.getImageData(0,0,w,h).data;
  const buf = new Uint8Array(w*4);
  for (let x=0; x<w; x++){
    let bottomRow = -1;
    for (let y=h-1; y>=0; y--){
      if (data[(y*w+x)*4+3] > 20){ bottomRow = y; break; }
    }
    const has = bottomRow >= 0;
    const edgeV = has ? (1 - bottomRow/h) : 0;
    buf[x*4] = Math.round(edgeV*255);
    buf[x*4+1] = 0;
    buf[x*4+2] = 0;
    buf[x*4+3] = has ? 255 : 0;
  }
  gl.bindTexture(gl.TEXTURE_2D, edgeTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, buf);
}

/* ---------------------------------------------------------------------
   RASTERIZAÇÃO DE TEXTO
--------------------------------------------------------------------- */

// calcula tamanho de fonte + posições pra caber o texto (multi-linha,
// centrado) na largura/altura do canvas — compartilhado entre a
// rasterização normal (branco sobre transparente) e a do pixel sort
// (que precisa das cores reais já compostas).
function computeTextLayout(ctx){
  const lines = state.text.split("\n").filter(l=>l.length>0);
  if (lines.length===0) return null;

  const widthPct = Math.max(0.1, state.font.width/100);
  const heightPct = Math.max(0.1, state.font.height/100);
  const marginX = RENDER_W*0.06;
  const maxW = (RENDER_W - marginX*2) / widthPct;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  function widest(size){
    ctx.font = fontCss(size);
    let w = 0;
    for (const l of lines) w = Math.max(w, ctx.measureText(l).width);
    return w;
  }
  let lo=4, hi=RENDER_H*1.5;
  for (let iter=0; iter<20; iter++){
    const mid=(lo+hi)/2;
    if (widest(mid) > maxW) hi=mid; else lo=mid;
  }
  let fontSize = lo * Math.max(0.1, state.font.size/100);
  const leadingMul = Math.max(0.4, state.font.leading/100) * 1.02;
  const lineHeight0 = fontSize*leadingMul;
  const totalH0 = lineHeight0*lines.length;
  const maxH = (RENDER_H*0.86) / heightPct;
  if (totalH0 > maxH) fontSize *= maxH/totalH0;

  ctx.font = fontCss(fontSize);
  try { ctx.letterSpacing = `${(state.font.kerning/100)*fontSize*0.3}px`; } catch(e){}
  const lineHeight = fontSize*leadingMul;
  const startY = RENDER_H/2 - (lineHeight*(lines.length-1))/2;
  return { lines, fontSize, lineHeight, startY, widthPct, heightPct };
}

function rasterizeSimple(){
  const c = rasterCanvas;
  c.width = RENDER_W; c.height = RENDER_H;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,RENDER_W,RENDER_H);
  const layout = computeTextLayout(ctx);
  if (!layout) return;
  ctx.fillStyle = "#fff";
  layout.lines.forEach((l,i)=>{
    const y = layout.startY + i*layout.lineHeight;
    ctx.save();
    ctx.translate(RENDER_W/2, y);
    ctx.scale(layout.widthPct, layout.heightPct);
    ctx.fillText(l, 0, 0);
    ctx.restore();
  });
}

// modo Pixel Sort: desenha com as cores reais (tinta sobre fundo) e
// ordena os pixels de cada linha/coluna por luminância dentro de trechos
// acima de um limiar — técnica clássica de "databending" glitch.
function computeSortedPixelTexture(){
  const w = RENDER_W, h = RENDER_H;
  const work = document.createElement("canvas");
  work.width = w; work.height = h;
  const ctx = work.getContext("2d");
  ctx.fillStyle = state.bg;
  ctx.fillRect(0,0,w,h);
  const layout = computeTextLayout(ctx);
  if (layout){
    ctx.fillStyle = state.ink;
    layout.lines.forEach((l,i)=>{
      const y = layout.startY + i*layout.lineHeight;
      ctx.save();
      ctx.translate(w/2, y);
      ctx.scale(layout.widthPct, layout.heightPct);
      ctx.fillText(l, 0, 0);
      ctx.restore();
    });
  }

  const imgData = ctx.getImageData(0,0,w,h);
  const data = imgData.data;
  const threshold = state.pixelsort.threshold/100*255;
  const chance = state.pixelsort.chance;
  const reverse = state.pixelsort.reverse;
  const horizontal = state.pixelsort.direction === "horizontal";

  function lumAt(idx){ return 0.299*data[idx]+0.587*data[idx+1]+0.114*data[idx+2]; }
  function sortRun(getIdx, len){
    let p = 0;
    while (p < len){
      if (lumAt(getIdx(p)) < threshold){ p++; continue; }
      let start = p;
      while (p < len && lumAt(getIdx(p)) >= threshold) p++;
      const end = p;
      if (end-start > 1){
        const slice = [];
        for (let k=start;k<end;k++){
          const idx = getIdx(k);
          slice.push([data[idx],data[idx+1],data[idx+2],data[idx+3]]);
        }
        slice.sort((a,b)=>(0.299*a[0]+0.587*a[1]+0.114*a[2])-(0.299*b[0]+0.587*b[1]+0.114*b[2]));
        if (reverse) slice.reverse();
        for (let k=0;k<slice.length;k++){
          const idx = getIdx(start+k);
          data[idx]=slice[k][0]; data[idx+1]=slice[k][1]; data[idx+2]=slice[k][2]; data[idx+3]=slice[k][3];
        }
      }
    }
  }

  if (horizontal){
    for (let y=0;y<h;y++){
      if (Math.random()*100 > chance) continue;
      sortRun((x)=> (y*w+x)*4, w);
    }
  } else {
    for (let x=0;x<w;x++){
      if (Math.random()*100 > chance) continue;
      sortRun((y)=> (y*w+x)*4, h);
    }
  }

  ctx.putImageData(imgData,0,0);
  gl.bindTexture(gl.TEXTURE_2D, pixelSortTex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, work);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
}

function rasterizeDenseBlock(){
  const c = rasterCanvas;
  c.width = RENDER_W; c.height = RENDER_H;
  const ctx = c.getContext("2d");
  ctx.clearRect(0,0,RENDER_W,RENDER_H);

  let raw = state.text.replace(/\n+/g," ").trim();
  if (state.block.removeSpaces) raw = raw.replace(/\s+/g,"");
  else raw = raw.replace(/\s+/g," ");
  if (!raw) return;

  const marginX = RENDER_W*0.05;
  const marginY = RENDER_H*0.05;
  const targetW = RENDER_W - marginX*2;
  const fontSize = Math.max(6, state.block.size/100 * RENDER_H*0.08);
  ctx.font = fontCss(fontSize);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const spacing = state.block.spacing/100 * fontSize*0.3;

  function lineWidth(str){
    let w=0;
    for (const ch of str) w += ctx.measureText(ch).width + spacing;
    return w - (str.length?spacing:0);
  }

  // greedy char wrap (pode quebrar no meio da palavra, igual referência)
  const lines = [];
  let i = 0;
  while (i < raw.length){
    let lo=1, hi=raw.length-i;
    while (lo<hi){
      const mid = Math.ceil((lo+hi)/2);
      if (lineWidth(raw.substr(i,mid)) <= targetW) lo=mid; else hi=mid-1;
    }
    const take = Math.max(1, lo);
    lines.push(raw.substr(i, take));
    i += take;
  }

  const lineHeight = fontSize*1.12;
  const totalH = lineHeight*lines.length;
  let startY = RENDER_H/2 - totalH/2 + fontSize*0.8;
  if (totalH > RENDER_H - marginY*2){
    startY = marginY + fontSize*0.8;
  }

  ctx.fillStyle = "#fff";
  lines.forEach((line, li)=>{
    const isLast = li===lines.length-1;
    const y = startY + li*lineHeight;
    const naturalW = lineWidth(line);
    const scaleX = (!isLast && naturalW>0) ? targetW/naturalW : 1;
    ctx.save();
    ctx.translate(marginX, y);
    ctx.scale(scaleX, 1);
    let x = 0;
    for (const ch of line){
      ctx.fillText(ch, x, 0);
      x += ctx.measureText(ch).width + spacing;
    }
    ctx.restore();
  });
}

// desfoca o texto ANTES de qualquer efeito de modo — feito no canvas 2D
// (não na GPU) pra ficar automaticamente consistente com tudo que lê
// rasterCanvas diretamente, como a análise de coluna do modo Derreter.
function applyPreBlur(){
  const blurPx = state.font.blur/100 * RENDER_H*0.025;
  if (blurPx < 0.3) return;
  const tmp = document.createElement("canvas");
  tmp.width = rasterCanvas.width; tmp.height = rasterCanvas.height;
  const tctx = tmp.getContext("2d");
  tctx.filter = `blur(${blurPx}px)`;
  tctx.drawImage(rasterCanvas, 0, 0);
  const ctx = rasterCanvas.getContext("2d");
  ctx.clearRect(0,0,rasterCanvas.width,rasterCanvas.height);
  ctx.drawImage(tmp, 0, 0);
}

function rasterize(){
  if (state.mode === "block") rasterizeDenseBlock();
  else rasterizeSimple();
  if (state.mode !== "pixelsort") applyPreBlur();
  uploadRaster();
  if (state.mode === "melt") computeColumnEdges();
  if (state.mode === "pixelsort") computeSortedPixelTexture();
}

/* ---------------------------------------------------------------------
   RENDER
--------------------------------------------------------------------- */

function hexToRgb(hex){
  const v = parseInt(hex.slice(1),16);
  return [((v>>16)&255)/255, ((v>>8)&255)/255, (v&255)/255];
}

function blurPass(srcTex, dstFBO, radiusPx){
  gl.useProgram(blurProg);
  bindQuad(blurProg);
  const uDir = gl.getUniformLocation(blurProg,"uDirection");
  const uRad = gl.getUniformLocation(blurProg,"uRadius");
  const uTex = gl.getUniformLocation(blurProg,"uTex");
  gl.activeTexture(gl.TEXTURE0);
  gl.uniform1i(uTex, 0);

  gl.bindFramebuffer(gl.FRAMEBUFFER, pingFBO);
  gl.viewport(0,0,RENDER_W,RENDER_H);
  gl.bindTexture(gl.TEXTURE_2D, srcTex);
  gl.uniform2f(uDir, 1.0/RENDER_W, 0.0);
  gl.uniform1f(uRad, radiusPx);
  drawQuad();

  gl.bindFramebuffer(gl.FRAMEBUFFER, dstFBO);
  gl.viewport(0,0,RENDER_W,RENDER_H);
  gl.bindTexture(gl.TEXTURE_2D, pingTex);
  gl.uniform2f(uDir, 0.0, 1.0/RENDER_H);
  gl.uniform1f(uRad, radiusPx);
  drawQuad();
}

function renderEffect(){
  const ink = hexToRgb(state.ink);
  const bg = hexToRgb(state.bg);

  if (state.mode === "block" || state.mode === "pixelsort"){
    const srcTex = state.mode === "pixelsort" ? pixelSortTex : textTex;
    const prog = state.mode === "pixelsort" ? directProg : passProg;
    gl.useProgram(prog);
    bindQuad(prog);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, srcTex);
    gl.uniform1i(gl.getUniformLocation(prog,"uTex"), 0);
    if (state.mode === "block"){
      gl.uniform3f(gl.getUniformLocation(prog,"uInk"), ink[0],ink[1],ink[2]);
      gl.uniform3f(gl.getUniformLocation(prog,"uBg"), bg[0],bg[1],bg[2]);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, effectFBO);
    gl.viewport(0,0,RENDER_W,RENDER_H);
    drawQuad();
    return;
  }

  if (state.mode === "blur"){
    const radiusPx = Math.max(0.5, state.blur.amount/100 * RENDER_H*0.05);
    blurPass(textTex, blurredFBO, radiusPx);

    gl.useProgram(blurDitherProg);
    bindQuad(blurDitherProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, blurredTex);
    gl.uniform1i(gl.getUniformLocation(blurDitherProg,"uBlurredTex"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(gl.getUniformLocation(blurDitherProg,"uCrispTex"), 1);
    gl.uniform1f(gl.getUniformLocation(blurDitherProg,"uDitherAmount"), state.blur.dither/100);
    gl.uniform1f(gl.getUniformLocation(blurDitherProg,"uDitherScale"), Math.max(1, state.blur.grain/100*8+1));
    gl.uniform3f(gl.getUniformLocation(blurDitherProg,"uInk"), ink[0],ink[1],ink[2]);
    gl.uniform3f(gl.getUniformLocation(blurDitherProg,"uBg"), bg[0],bg[1],bg[2]);
    gl.uniform2f(gl.getUniformLocation(blurDitherProg,"uResolution"), RENDER_W, RENDER_H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, effectFBO);
    gl.viewport(0,0,RENDER_W,RENDER_H);
    drawQuad();
    return;
  }

  if (state.mode === "melt"){
    gl.useProgram(meltProg);
    bindQuad(meltProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(gl.getUniformLocation(meltProg,"uTex"), 0);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, edgeTex);
    gl.uniform1i(gl.getUniformLocation(meltProg,"uEdgeTex"), 1);
    gl.uniform1f(gl.getUniformLocation(meltProg,"uMeltAmount"), state.melt.amount/100);
    gl.uniform1f(gl.getUniformLocation(meltProg,"uMeltScale"), 1+state.melt.scale/100*6);
    gl.uniform1f(gl.getUniformLocation(meltProg,"uDripAmount"), state.melt.drip/100);
    gl.uniform1f(gl.getUniformLocation(meltProg,"uSeed"), state.seed);
    gl.uniform3f(gl.getUniformLocation(meltProg,"uInk"), ink[0],ink[1],ink[2]);
    gl.uniform3f(gl.getUniformLocation(meltProg,"uBg"), bg[0],bg[1],bg[2]);
    gl.uniform2f(gl.getUniformLocation(meltProg,"uResolution"), RENDER_W, RENDER_H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, effectFBO);
    gl.viewport(0,0,RENDER_W,RENDER_H);
    drawQuad();
    return;
  }

  if (state.mode === "degrade"){
    gl.useProgram(degradeProg);
    bindQuad(degradeProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(gl.getUniformLocation(degradeProg,"uTex"), 0);
    gl.uniform1f(gl.getUniformLocation(degradeProg,"uGlitch"), state.degrade.glitch/100);
    gl.uniform1f(gl.getUniformLocation(degradeProg,"uDropout"), state.degrade.dropout/100);
    gl.uniform1f(gl.getUniformLocation(degradeProg,"uContrast"), state.degrade.contrast/100);
    gl.uniform3f(gl.getUniformLocation(degradeProg,"uInk"), ink[0],ink[1],ink[2]);
    gl.uniform3f(gl.getUniformLocation(degradeProg,"uBg"), bg[0],bg[1],bg[2]);
    gl.uniform2f(gl.getUniformLocation(degradeProg,"uResolution"), RENDER_W, RENDER_H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, effectFBO);
    gl.viewport(0,0,RENDER_W,RENDER_H);
    drawQuad();
    return;
  }

  if (state.mode === "halftone"){
    // escala tudo em px relativo à resolução de referência (preview),
    // pra densidade do padrão ficar igual entre preview e export em alta-res
    const s = RENDER_H/PREVIEW_LONG_EDGE;
    gl.useProgram(halftoneProg);
    bindQuad(halftoneProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, textTex);
    gl.uniform1i(gl.getUniformLocation(halftoneProg,"uTex"), 0);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uMinDot"), state.halftone.minDot/100*30*s);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uMaxDot"), (2+state.halftone.maxDot/100*38)*s);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uCornerRadius"), state.halftone.cornerRadius/100*30*s);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uSpacing"), (4+state.halftone.spacing/100*36)*s);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uAngleDeg"), state.halftone.angle);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uGridType"), {regular:0, benday:1, hex:2}[state.halftone.gridType] ?? 0);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uNoiseAmt"), state.halftone.noise/100*20*s);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uInvert"), state.halftone.invert?1:0);
    gl.uniform3f(gl.getUniformLocation(halftoneProg,"uInk"), ink[0],ink[1],ink[2]);
    gl.uniform3f(gl.getUniformLocation(halftoneProg,"uBg"), bg[0],bg[1],bg[2]);
    gl.uniform2f(gl.getUniformLocation(halftoneProg,"uResolution"), RENDER_W, RENDER_H);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uMergeSize"), state.halftone.mergeSize);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uMergeThreshold"), state.halftone.mergeThreshold/100);
    gl.uniform1f(gl.getUniformLocation(halftoneProg,"uMultiTone"), state.halftone.multiTone?1:0);
    gl.uniform1i(gl.getUniformLocation(halftoneProg,"uToneLevels"), state.halftone.toneLevels);
    const shapeIdx = {round:0, cross:1, ring:2};
    const toneColorArr = new Float32Array(4*3);
    const toneShapeArr = new Float32Array(4);
    for (let i=0;i<4;i++){
      const c = hexToRgb(state.halftone.toneColors[i]);
      toneColorArr[i*3]=c[0]; toneColorArr[i*3+1]=c[1]; toneColorArr[i*3+2]=c[2];
      toneShapeArr[i] = shapeIdx[state.halftone.toneShapes[i]] ?? 0;
    }
    gl.uniform3fv(gl.getUniformLocation(halftoneProg,"uToneColor"), toneColorArr);
    gl.uniform1fv(gl.getUniformLocation(halftoneProg,"uToneShape"), toneShapeArr);
    gl.bindFramebuffer(gl.FRAMEBUFFER, effectFBO);
    gl.viewport(0,0,RENDER_W,RENDER_H);
    drawQuad();
    return;
  }

  if (state.mode === "crosshatch"){
    const radiusPx = Math.max(1, state.crosshatch.softness/100 * RENDER_H*0.02);
    blurPass(textTex, blurredFBO, radiusPx);

    gl.useProgram(crosshatchProg);
    bindQuad(crosshatchProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, blurredTex);
    gl.uniform1i(gl.getUniformLocation(crosshatchProg,"uTex"), 0);
    gl.uniform1f(gl.getUniformLocation(crosshatchProg,"uScale"), 6+state.crosshatch.scale/100*40);
    gl.uniform1f(gl.getUniformLocation(crosshatchProg,"uThickness"), state.crosshatch.thickness);
    gl.uniform1f(gl.getUniformLocation(crosshatchProg,"uAngleDeg"), state.crosshatch.angle);
    gl.uniform3f(gl.getUniformLocation(crosshatchProg,"uInk"), ink[0],ink[1],ink[2]);
    gl.uniform3f(gl.getUniformLocation(crosshatchProg,"uBg"), bg[0],bg[1],bg[2]);
    gl.uniform2f(gl.getUniformLocation(crosshatchProg,"uResolution"), RENDER_W, RENDER_H);
    gl.bindFramebuffer(gl.FRAMEBUFFER, effectFBO);
    gl.viewport(0,0,RENDER_W,RENDER_H);
    drawQuad();
    return;
  }
}

function applyAdjustments(){
  gl.useProgram(adjustProg);
  bindQuad(adjustProg);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, effectTex);
  gl.uniform1i(gl.getUniformLocation(adjustProg,"uTex"), 0);
  gl.uniform1f(gl.getUniformLocation(adjustProg,"uBrightness"), state.adjust.brightness/100);
  gl.uniform1f(gl.getUniformLocation(adjustProg,"uContrast"), state.adjust.contrast/100);
  gl.uniform1f(gl.getUniformLocation(adjustProg,"uGamma"), Math.max(0.2, state.adjust.gamma/100));
  gl.uniform1f(gl.getUniformLocation(adjustProg,"uZoom"), state.zoom/100);
  const bg = hexToRgb(state.bg);
  gl.uniform3f(gl.getUniformLocation(adjustProg,"uBg"), bg[0],bg[1],bg[2]);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0,0,RENDER_W,RENDER_H);
  drawQuad();
}

function render(){
  renderEffect();
  applyAdjustments();
}

function fullUpdate(){
  rasterize();
  render();
}

let renderQueued = false;
let needsRasterize = false;
function scheduleUpdate(full){
  // requestRender e requestFullUpdate compartilham a mesma fila: se um
  // render "barato" já está agendado quando um full update chega, o full
  // update precisa "promover" esse agendamento, senão a rasterização fica
  // pra trás (texto/modo novo, mas textura antiga).
  if (full) needsRasterize = true;
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(()=>{
    renderQueued = false;
    if (needsRasterize){ needsRasterize = false; rasterize(); }
    render();
  });
}
function requestRender(){ scheduleUpdate(false); }
function requestFullUpdate(){ scheduleUpdate(true);
}

/* ---------------------------------------------------------------------
   RESOLUÇÃO
--------------------------------------------------------------------- */

function setResolution(longEdge){
  const ratio = state.format.ratio;
  if (ratio <= 1){ RENDER_H = Math.round(longEdge); RENDER_W = Math.round(longEdge*ratio); }
  else { RENDER_W = Math.round(longEdge); RENDER_H = Math.round(longEdge/ratio); }
  canvas.width = RENDER_W; canvas.height = RENDER_H;
  document.getElementById("resLabel").textContent = `${RENDER_W} × ${RENDER_H}px`;
  ensureTargets(RENDER_W, RENDER_H);
}

/* ---------------------------------------------------------------------
   UI
--------------------------------------------------------------------- */

const formatSel = document.getElementById("formatSel");
FORMATS.forEach(f=>{
  const o = document.createElement("option");
  o.value=f.key; o.textContent=f.label;
  formatSel.appendChild(o);
});
formatSel.addEventListener("change", ()=>{
  state.format = FORMATS.find(f=>f.key===formatSel.value);
  setResolution(PREVIEW_LONG_EDGE);
  requestFullUpdate();
});

const zoomSlider = document.getElementById("zoomSlider");
const zoomSliderVal = document.getElementById("zoomSliderVal");
zoomSlider.addEventListener("input", ()=>{
  state.zoom = +zoomSlider.value;
  zoomSliderVal.textContent = zoomSlider.value+"%";
  requestRender();
});

const textInput = document.getElementById("textInput");
textInput.value = state.text;
textInput.addEventListener("input", ()=>{
  state.text = textInput.value;
  requestFullUpdate();
});

const fontFamilySel = document.getElementById("fontFamily");
function buildFontFamilyOptions(){
  fontFamilySel.innerHTML = "";
  FONT_FAMILIES.forEach(f=>{
    const o = document.createElement("option");
    o.value=f.value; o.textContent=f.label;
    fontFamilySel.appendChild(o);
  });
  if (customFontFamily){
    const o = document.createElement("option");
    o.value = "custom"; o.textContent = customFontFamily.label + " (carregada)";
    fontFamilySel.appendChild(o);
  }
  fontFamilySel.value = state.font.family;
}
buildFontFamilyOptions();
fontFamilySel.addEventListener("change", ()=>{
  state.font.family = fontFamilySel.value;
  requestFullUpdate();
});

document.getElementById("fontUpload").addEventListener("change", async (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const face = new FontFace("TypeFXCustomFont", buf);
    await face.load();
    document.fonts.add(face);
    customFontFamily = { label: file.name.replace(/\.[^.]+$/,""), css:'"TypeFXCustomFont"', weight:400 };
    state.font.family = "custom";
    buildFontFamilyOptions();
    requestFullUpdate();
  } catch(err){
    console.error("Falha ao carregar fonte", err);
    alert("Não foi possível carregar essa fonte. Verifique se o arquivo é um TTF/OTF/WOFF/WOFF2 válido.");
  }
});

function bindFontSlider(id, key, suffix="%"){
  const el = document.getElementById(id);
  const val = document.getElementById(id+"Val");
  el.addEventListener("input", ()=>{
    state.font[key] = +el.value;
    val.textContent = el.value+suffix;
    requestFullUpdate();
  });
}
bindFontSlider("fontSize","size");
bindFontSlider("fontLeading","leading");
bindFontSlider("fontWidth","width");
bindFontSlider("fontHeight","height");
bindFontSlider("fontKerning","kerning");
bindFontSlider("fontBlur","blur");

function colorChanged(){
  // pixel sort compõe a cor já na rasterização (CPU), então precisa de
  // um full update; os outros modos só recolorem no shader (render basta).
  if (state.mode === "pixelsort") requestFullUpdate();
  else requestRender();
}
document.getElementById("inkColor").addEventListener("input", (e)=>{ state.ink=e.target.value; colorChanged(); });
document.getElementById("bgColor").addEventListener("input", (e)=>{ state.bg=e.target.value; colorChanged(); });

function bindAdjustSlider(id, key){
  const el = document.getElementById(id);
  const val = document.getElementById(id+"Val");
  el.addEventListener("input", ()=>{
    state.adjust[key] = +el.value;
    val.textContent = el.value;
    requestRender();
  });
}
bindAdjustSlider("adjBrightness","brightness");
bindAdjustSlider("adjContrast","contrast");
bindAdjustSlider("adjGamma","gamma");

document.querySelectorAll(".modebtns button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    document.querySelectorAll(".modebtns button").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    state.mode = btn.dataset.mode;
    renderModeParams();
    requestFullUpdate();
  });
});

function sliderRow(container, label, get, set, min=0, max=100, suffix="%"){
  const row = document.createElement("div"); row.className="row";
  const lbl = document.createElement("label"); lbl.textContent=label;
  const inp = document.createElement("input"); inp.type="range"; inp.autocomplete="off"; inp.min=min; inp.max=max; inp.value=get();
  const val = document.createElement("span"); val.className="val"; val.textContent=get()+suffix;
  inp.addEventListener("input", ()=>{ set(+inp.value); val.textContent=inp.value+suffix; requestRender(); });
  row.appendChild(lbl); row.appendChild(inp); row.appendChild(val);
  container.appendChild(row);
}

function renderModeParams(){
  const c = document.getElementById("modeParams");
  c.innerHTML = "";
  const panel = document.createElement("div"); panel.className="panel";
  const h = document.createElement("h2");

  if (state.mode==="blur"){
    h.textContent = "Blur / Grão";
    panel.appendChild(h);
    sliderRow(panel,"Quantidade de blur", ()=>state.blur.amount, v=>state.blur.amount=v);
    sliderRow(panel,"Granulado (dither)", ()=>state.blur.dither, v=>state.blur.dither=v);
    sliderRow(panel,"Escala do grão", ()=>state.blur.grain, v=>state.blur.grain=v);
  } else if (state.mode==="melt"){
    h.textContent = "Derreter";
    panel.appendChild(h);
    sliderRow(panel,"Quantidade", ()=>state.melt.amount, v=>state.melt.amount=v);
    sliderRow(panel,"Escala do ruído", ()=>state.melt.scale, v=>state.melt.scale=v);
    sliderRow(panel,"Escorrido (drip)", ()=>state.melt.drip, v=>state.melt.drip=v);
    const btnrow = document.createElement("div"); btnrow.className="btnrow";
    const regen = document.createElement("button"); regen.className="ghost"; regen.style.flex="1";
    regen.textContent = "Nova variação";
    regen.addEventListener("click", ()=>{ state.seed = Math.random()*100; requestRender(); });
    btnrow.appendChild(regen);
    panel.appendChild(btnrow);
  } else if (state.mode==="degrade"){
    h.textContent = "Degradação";
    panel.appendChild(h);
    sliderRow(panel,"Glitch (faixas)", ()=>state.degrade.glitch, v=>state.degrade.glitch=v);
    sliderRow(panel,"Falha de tinta", ()=>state.degrade.dropout, v=>state.degrade.dropout=v);
    sliderRow(panel,"Contraste", ()=>state.degrade.contrast, v=>state.degrade.contrast=v);
  } else if (state.mode==="block"){
    h.textContent = "Bloco denso";
    panel.appendChild(h);
    sliderRow(panel,"Tamanho da fonte", ()=>state.block.size, v=>{state.block.size=v; requestFullUpdate();});
    sliderRow(panel,"Espaçamento", ()=>state.block.spacing, v=>{state.block.spacing=v; requestFullUpdate();});
    const chk = document.createElement("div"); chk.className="check";
    const cb = document.createElement("input"); cb.type="checkbox"; cb.checked=state.block.removeSpaces; cb.id="removeSpaces";
    const cl = document.createElement("label"); cl.htmlFor="removeSpaces"; cl.textContent="Remover espaços entre palavras";
    cb.addEventListener("change", ()=>{ state.block.removeSpaces=cb.checked; requestFullUpdate(); });
    chk.appendChild(cb); chk.appendChild(cl);
    panel.appendChild(chk);
  } else if (state.mode==="halftone"){
    h.textContent = "Halftone";
    panel.appendChild(h);
    selectRow(panel,"Grid", ()=>state.halftone.gridType, v=>state.halftone.gridType=v, [
      {value:"regular", label:"Regular"},
      {value:"benday", label:"Benday"},
      {value:"hex", label:"Hex"},
    ]);
    sliderRow(panel,"Espaçamento", ()=>state.halftone.spacing, v=>state.halftone.spacing=v);
    sliderRow(panel,"Ponto mínimo", ()=>state.halftone.minDot, v=>state.halftone.minDot=v);
    sliderRow(panel,"Ponto máximo", ()=>state.halftone.maxDot, v=>state.halftone.maxDot=v);
    sliderRow(panel,"Raio do canto", ()=>state.halftone.cornerRadius, v=>state.halftone.cornerRadius=v);
    sliderRow(panel,"Ângulo", ()=>state.halftone.angle, v=>state.halftone.angle=v, 0, 90, "°");
    sliderRow(panel,"Ruído (posição)", ()=>state.halftone.noise, v=>state.halftone.noise=v);
    const chk = document.createElement("div"); chk.className="check";
    const cb = document.createElement("input"); cb.type="checkbox"; cb.checked=state.halftone.invert; cb.id="haltInvert";
    const cl = document.createElement("label"); cl.htmlFor="haltInvert"; cl.textContent="Inverter";
    cb.addEventListener("change", ()=>{ state.halftone.invert=cb.checked; requestRender(); });
    chk.appendChild(cb); chk.appendChild(cl);
    panel.appendChild(chk);

    const hr1 = document.createElement("div");
    hr1.style.cssText = "border-top:1px solid var(--ink); margin:10px 0 8px; padding-top:8px; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);";
    hr1.textContent = "Fusão de área forte";
    panel.appendChild(hr1);
    selectRow(panel,"Fusão", ()=>String(state.halftone.mergeSize), v=>{state.halftone.mergeSize=+v; requestRender();}, [
      {value:"1", label:"Desligado"},
      {value:"2", label:"2×2"},
      {value:"3", label:"3×3"},
      {value:"4", label:"4×4"},
    ]);
    sliderRow(panel,"Limiar da fusão", ()=>state.halftone.mergeThreshold, v=>state.halftone.mergeThreshold=v);

    const hr2 = document.createElement("div");
    hr2.style.cssText = "border-top:1px solid var(--ink); margin:10px 0 8px; padding-top:8px; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);";
    hr2.textContent = "Multi-tom";
    panel.appendChild(hr2);
    const mtChk = document.createElement("div"); mtChk.className="check";
    const mtCb = document.createElement("input"); mtCb.type="checkbox"; mtCb.checked=state.halftone.multiTone; mtCb.id="haltMultiTone";
    const mtCl = document.createElement("label"); mtCl.htmlFor="haltMultiTone"; mtCl.textContent="Cor e forma por faixa de tom";
    mtCb.addEventListener("change", ()=>{ state.halftone.multiTone=mtCb.checked; renderModeParams(); requestRender(); });
    mtChk.appendChild(mtCb); mtChk.appendChild(mtCl);
    panel.appendChild(mtChk);

    if (state.halftone.multiTone){
      sliderRow(panel,"Níveis de tom", ()=>state.halftone.toneLevels, v=>{state.halftone.toneLevels=v; renderModeParams(); requestRender();}, 2, 4, "");
      for (let i=0;i<state.halftone.toneLevels;i++){
        const row = document.createElement("div"); row.className="row";
        const lbl = document.createElement("label"); lbl.textContent = `Tom ${i+1}`;
        const colorInp = document.createElement("input"); colorInp.type="color"; colorInp.value=state.halftone.toneColors[i];
        colorInp.style.flex="1";
        colorInp.addEventListener("input", ()=>{ state.halftone.toneColors[i]=colorInp.value; requestRender(); });
        const shapeSel = document.createElement("select"); shapeSel.style.flex="1";
        [{value:"round",label:"Redondo"},{value:"cross",label:"Cruz"},{value:"ring",label:"Anel"}].forEach(o=>{
          const opt = document.createElement("option");
          opt.value=o.value; opt.textContent=o.label;
          if (o.value===state.halftone.toneShapes[i]) opt.selected=true;
          shapeSel.appendChild(opt);
        });
        shapeSel.addEventListener("change", ()=>{ state.halftone.toneShapes[i]=shapeSel.value; requestRender(); });
        row.appendChild(lbl); row.appendChild(colorInp); row.appendChild(shapeSel);
        panel.appendChild(row);
      }
    }
  } else if (state.mode==="pixelsort"){
    h.textContent = "Pixel Sort";
    panel.appendChild(h);
    selectRow(panel,"Direção", ()=>state.pixelsort.direction, v=>{state.pixelsort.direction=v; requestFullUpdate();}, [
      {value:"horizontal", label:"Horizontal"},
      {value:"vertical", label:"Vertical"},
    ]);
    sliderRow(panel,"Limiar", ()=>state.pixelsort.threshold, v=>{state.pixelsort.threshold=v; requestFullUpdate();});
    sliderRow(panel,"% de linhas afetadas", ()=>state.pixelsort.chance, v=>{state.pixelsort.chance=v; requestFullUpdate();});
    const chk = document.createElement("div"); chk.className="check";
    const cb = document.createElement("input"); cb.type="checkbox"; cb.checked=state.pixelsort.reverse; cb.id="sortReverse";
    const cl = document.createElement("label"); cl.htmlFor="sortReverse"; cl.textContent="Inverter ordem";
    cb.addEventListener("change", ()=>{ state.pixelsort.reverse=cb.checked; requestFullUpdate(); });
    chk.appendChild(cb); chk.appendChild(cl);
    panel.appendChild(chk);
    const btnrow = document.createElement("div"); btnrow.className="btnrow";
    const regen = document.createElement("button"); regen.className="ghost"; regen.style.flex="1";
    regen.textContent = "Nova variação";
    regen.addEventListener("click", requestFullUpdate);
    btnrow.appendChild(regen);
    panel.appendChild(btnrow);
  } else if (state.mode==="crosshatch"){
    h.textContent = "Crosshatch";
    panel.appendChild(h);
    sliderRow(panel,"Escala da hachura", ()=>state.crosshatch.scale, v=>state.crosshatch.scale=v);
    sliderRow(panel,"Espessura da linha", ()=>state.crosshatch.thickness, v=>state.crosshatch.thickness=v);
    sliderRow(panel,"Ângulo", ()=>state.crosshatch.angle, v=>state.crosshatch.angle=v, 0, 90, "°");
    sliderRow(panel,"Suavização", ()=>state.crosshatch.softness, v=>state.crosshatch.softness=v);
  }
  c.appendChild(panel);
}

function selectRow(container, label, get, set, options){
  const row = document.createElement("div"); row.className="row";
  const lbl = document.createElement("label"); lbl.textContent=label;
  const sel = document.createElement("select");
  options.forEach(o=>{
    const opt = document.createElement("option");
    opt.value=o.value; opt.textContent=o.label;
    if (o.value===get()) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.addEventListener("change", ()=>{ set(sel.value); requestRender(); });
  row.appendChild(lbl); row.appendChild(sel);
  container.appendChild(row);
}

document.getElementById("exportBtn").addEventListener("click", ()=>{
  // sem esperar requestAnimationFrame aqui: os comandos WebGL abaixo já
  // são enfileirados de forma síncrona, e um rAF pendente pode nunca
  // disparar se a aba estiver em segundo plano (ex: usuário trocou de
  // aba logo depois de clicar exportar), travando a exportação.
  const scale = +document.getElementById("exportScale").value;
  const targetLongEdge = Math.round(PREVIEW_LONG_EDGE*scale);
  setResolution(targetLongEdge);
  rasterize();
  render();
  canvas.toBlob((blob)=>{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "typefx.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setResolution(PREVIEW_LONG_EDGE);
    fullUpdate();
  }, "image/png");
});

/* ---------------------------------------------------------------------
   INIT
--------------------------------------------------------------------- */

async function init(){
  await document.fonts.load(`900 100px "Archivo"`).catch(()=>{});
  await document.fonts.ready;
  formatSel.value = state.format.key;
  setResolution(PREVIEW_LONG_EDGE);
  renderModeParams();
  fullUpdate();
}
init();
</script>
